<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HA88Lucky</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;color:#f7f8fb;background:radial-gradient(circle at 20% 0,#153d61,transparent 38%),radial-gradient(circle at 90% 10%,#4a1c50,transparent 35%),#060912;min-height:100vh}main{max-width:1200px;margin:auto;padding:16px}.glass{background:rgba(15,22,38,.86);border:1px solid #ffffff14;border-radius:20px;padding:16px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(14px)}.brand{font-size:34px;font-weight:900;background:linear-gradient(90deg,#fff,#ffd45a,#fff);-webkit-background-clip:text;color:transparent}.muted{color:#aeb8ca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.game{height:155px;position:relative;overflow:hidden;cursor:pointer;transform:perspective(700px) rotateX(0) rotateY(0);transition:.25s}.game:hover{transform:perspective(700px) rotateX(4deg) rotateY(-3deg) translateY(-4px);box-shadow:0 25px 60px #000b}.game:after{content:'';position:absolute;inset:-60%;background:conic-gradient(transparent,#fff2,transparent 30%);animation:r 7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.game>*{position:relative;z-index:2}.icon{font-size:48px}button,input{padding:11px;border-radius:11px;border:1px solid #ffffff16;background:#0b1220;color:#fff;margin:4px}button{background:linear-gradient(135deg,#e7ad37,#ffe27b);color:#18130a;font-weight:800;cursor:pointer}.chat{height:280px;overflow:auto;background:#070d18;border-radius:14px;padding:10px}.msg{padding:8px 10px;margin:7px 0;border-radius:12px;background:#172238}.bot{background:#10313d;border:1px solid #55d8ff33}.tag{font-size:11px;border-radius:20px;background:#26344d;padding:3px 7px}.balance{font-size:24px;color:#ffd45a;font-weight:900}.row{display:flex;gap:6px}.row>*{flex:1}@media(max-width:600px){main{padding:9px}.brand{font-size:27px}.row{flex-direction:column}}
</style></head><body><main><div class="glass"><div class="brand">HA88Lucky</div><div class="muted">Sảnh giải trí • TEST balance • Chat cộng đồng</div></div><div id="app"></div></main><script src="api.js"></script><script>
const games=[['taixiu','🎲','Tài Xỉu'],['sicbo','🎯','Sic Bo'],['dragon','🐉','Dragon Tiger'],['baucua','🦀','Bầu Cua'],['blackjack','🃏','Blackjack'],['xocdia','🪙','Xóc Đĩa'],['baccarat','♠️','Baccarat'],['slot','🎰','Slot'],['sports','🏆','Thể thao'],['lottery','🎟️','Xổ số']];let ctx;
function sound(c){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let f={taixiu:440,sicbo:520,dragon:330,baucua:390,blackjack:610,xocdia:470,baccarat:550,slot:720,sports:500,lottery:650}[c]||440;let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18)}catch(e){}}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function start(){let m=await api('me',null,'GET'); if(!m.user){app.innerHTML='<div class="grid"><div class="glass"><h2>Đăng nhập</h2><input id=li placeholder="Username / Email"><input id=lp type=password placeholder="Mật khẩu"><button onclick=login()>Đăng nhập</button></div><div class="glass"><h2>Tạo tài khoản</h2><input id=ru placeholder="Username"><input id=re placeholder="Email"><input id=rp type=password placeholder="Mật khẩu"><input id=rc placeholder="Tên nhân vật trong game"><button onclick=reg()>Tạo tài khoản</button></div></div>';return}let p=m.user.profile||{};app.innerHTML='<div class="glass"><div class="row"><div><h2>Xin chào '+esc(p.character_name||m.user.username)+'</h2><div class=muted>Nhân vật • Lv.'+(p.level||1)+'</div></div><div>Số dư<br><span id=bal class=balance>...</span> TEST</div></div></div><div class="glass"><h2>🎮 Sảnh game</h2><div class=games>'+games.map(g=>'<div class="glass game" onclick="sound(\''+g[0]+'\');alert(\'Đã chọn '+g[2]+' — có thể tích hợp scene 3D/engine riêng.\')"><div class=icon>'+g[1]+'</div><h3>'+g[2]+'</h3><span class=tag>nhạc + hiệu ứng riêng</span></div>').join('')+'</div></div><div class="grid"><div class="glass"><h3>💬 Chat cộng đồng</h3><div id=chat class=chat></div><div class=row><input id=cm placeholder="Nhắn trong sảnh..."><button onclick=send()>Gửi</button></div></div><div class="glass"><h3>💰 Ví & giao dịch</h3><div class=row><input id=da type=number placeholder="Nạp TEST"><input id=dm placeholder="Phương thức"></div><input id=dp placeholder="Mã/chứng từ"><button onclick=dep()>Nạp</button><hr><div class=row><input id=wa type=number placeholder="Rút TEST"><input id=wm placeholder="Phương thức"></div><input id=wd placeholder="Thông tin nhận"><button onclick=wit()>Rút</button></div></div><div class="glass"><h3>🛟 Hỗ trợ admin</h3><input id=sm placeholder="Tin nhắn riêng"><button onclick=sup()>Gửi hỗ trợ</button><button onclick=logout()>Đăng xuất</button></div>';wallet();load()}
async function login(){try{await api('login',{login:li.value,password:lp.value});location.reload()}catch(e){alert(e.message)}}async function reg(){try{await api('register',{username:ru.value,email:re.value,password:rp.value,character_name:rc.value});location.reload()}catch(e){alert(e.message)}}async function logout(){await api('logout',{});location.reload()}async function wallet(){let x=await api('wallet',null,'GET');bal.textContent=Number(x.balance).toLocaleString('vi-VN')}async function dep(){try{await api('deposit',{amount:+da.value,method:dm.value,proof:dp.value});alert('Đã gửi yêu cầu')}catch(e){alert(e.message)}}async function wit(){try{await api('withdraw',{amount:+wa.value,method:wm.value,destination:wd.value});alert('Đã gửi yêu cầu')}catch(e){alert(e.message)}}async function load(){let x=await api('lobby_messages',null,'GET');chat.innerHTML=x.items.map(m=>'<div class="msg '+(m.is_bot?'bot':'')+'"><b>'+esc(m.sender_name)+'</b> '+(m.is_bot?'<span class=tag>BOT</span>':'')+'<br>'+esc(m.message)+'</div>').join('');chat.scrollTop=chat.scrollHeight}async function send(){if(!cm.value.trim())return;await api('lobby_send',{message:cm.value});cm.value='';load()}async function sup(){try{await api('support_send',{message:sm.value});sm.value='';alert('Đã gửi admin')}catch(e){alert(e.message)}}start();</script></body></html>
