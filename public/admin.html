<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Admin V2</title><style>body{font-family:Arial;background:#0e1118;color:#eee;margin:0}.w{max-width:1250px;margin:auto;padding:14px}.c{background:#171c26;border:1px solid #303746;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #303746;text-align:left}input,button,select,textarea{padding:8px;border-radius:7px;border:1px solid #394153;background:#0d121b;color:#fff}button{background:#6548d8;border:0}.err{color:#ff8888}.chat{height:280px;overflow:auto;background:#0d1119;padding:8px}.msg{padding:7px;margin:5px;background:#202735;border-radius:7px}</style></head><body><div class="w"><h1>ROYAL ADMIN V2</h1><div id="err" class="err"></div><div id="stats" class="grid"></div><div class="c"><h2>💰 Quản lý Nạp / Rút</h2><select id="ms"><option value="">Tất cả</option><option>pending</option><option>approved</option><option>rejected</option></select> <button onclick="moneyReq()">Tải</button><div class="table"><table><thead><tr><th>ID</th><th>User</th><th>Loại</th><th>Số TEST</th><th>Phương thức</th><th>Thông tin</th><th>Status</th><th>Ghi chú</th><th></th></tr></thead><tbody id="mt"></tbody></table></div></div><div class="c"><h2>💬 Chat hỗ trợ</h2><div class="grid"><div><h3>Threads</h3><div id="threads"></div></div><div><h3 id="ctitle">Chọn cuộc trò chuyện</h3><div id="chat" class="chat"></div><div><input id="cm" placeholder="Trả lời người chơi" style="width:70%"><button onclick="sendChat()">Gửi</button></div><button onclick="closeChat()">Đóng thread</button></div></div></div><div class="c"><h2>Người chơi</h2><input id="q" placeholder="username/email"><button onclick="users()">Tìm</button><div class="table"><table><thead><tr><th>ID</th><th>User</th><th>Email</th><th>Status</th><th>Balance</th><th>Action</th></tr></thead><tbody id="ut"></tbody></table></div></div><div class="c"><h2>Game</h2><div class="table"><table><thead><tr><th>Game</th><th>Status</th><th>Min</th><th>Max</th><th>Seconds</th><th></th></tr></thead><tbody id="gt"></tbody></table></div></div><div class="c"><h2>Audit log</h2><div class="table"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th><th>Payload</th></tr></thead><tbody id="at"></tbody></table></div></div></div><script src="/api.js"></script><script>const $=x=>document.getElementById(x),money=n=>Number(n).toLocaleString('vi-VN');let selectedThread=null;async function init(){try{const m=await API.me();if(!m.user||m.user.role!=='admin'){location.href='/';return}await Promise.all([overview(),users(),games(),audit(),moneyReq(),threads()])}catch(e){$('err').textContent=e.message}}async function overview(){const x=await API.overview();$('stats').innerHTML=`<div class="c">Users<br><b>${x.users}</b></div><div class="c">Active<br><b>${x.active_users}</b></div><div class="c">TEST balance<br><b>${money(x.total_balance)}</b></div><div class="c">Active games<br><b>${x.active_games}</b></div>`}async function users(){const x=await API.users($('q').value);$('ut').innerHTML=x.items.map(u=>`<tr><td>${u.id}</td><td>${u.username}</td><td>${u.email}</td><td>${u.status}</td><td>${money(u.balance)}</td><td><button onclick="status(${u.id},'${u.status==='active'?'blocked':'active'}')">${u.status==='active'?'Khóa':'Mở'}</button> <button onclick="adjust(${u.id})">Điều chỉnh</button></td></tr>`).join('')}async function status(id,s){try{await API.status(id,s);await overview();await users();await audit()}catch(e){alert(e.message)}}async function adjust(id){const a=Number(prompt('Nhập + hoặc - TEST'));if(!Number.isFinite(a)||!a)return;const r=prompt('Lý do');if(!r)return;try{await API.adjust(id,a,r);await overview();await users();await audit()}catch(e){alert(e.message)}}async function moneyReq(){const x=await API.moneyAdmin($('ms').value);$('mt').innerHTML=x.items.map(r=>`<tr><td>${r.id}</td><td>${r.username}</td><td>${r.type}</td><td>${money(r.amount)}</td><td>${r.method||''}</td><td>${r.account_info||''}</td><td>${r.status}</td><td>${r.admin_note||''}</td><td>${r.status==='pending'?`<button onclick="processMoney(${r.id},'approved')">Duyệt</button> <button onclick="processMoney(${r.id},'rejected')">Từ chối</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9">Không có yêu cầu</td></tr>'}async function processMoney(id,s){const note=prompt('Ghi chú admin (tuỳ chọn)')||'';try{await API.processMoney(id,s,note);await moneyReq();await overview();await users();await audit()}catch(e){alert(e.message)}}async function threads(){const x=await API.threads();$('threads').innerHTML=x.items.map(t=>`<div class="c"><b>${t.username}</b><br><small>${t.status}</small><br>${t.last_message||''}<br><button onclick="openThread(${t.id},'${t.username.replace(/'/g,"&#39;")}')">Mở</button></div>`).join('')||'Chưa có thread'}async function openThread(id,name){selectedThread=id;$('ctitle').textContent='Chat với '+name;const x=await API.threadMessages(id);$('chat').innerHTML=x.items.map(m=>`<div class="msg"><b>${m.sender_type==='admin'?'Admin':m.sender_type==='bot'?'Bot':m.username||'User'}:</b> ${m.message}</div>`).join('')||'Chưa có';$('chat').scrollTop=$('chat').scrollHeight}async function sendChat(){if(!selectedThread)return alert('Chọn thread');const m=$('cm').value.trim();if(!m)return;try{await API.sendAdminChat(selectedThread,m);$('cm').value='';await openThread(selectedThread,'người chơi');await threads()}catch(e){alert(e.message)}}async function closeChat(){if(!selectedThread)return;try{await API.closeThread(selectedThread);await threads()}catch(e){alert(e.message)}}async function games(){const x=await API.gamesAdmin();$('gt').innerHTML=x.items.map(g=>`<tr><td>${g.name}</td><td><select id="s${g.id}"><option ${g.status==='active'?'selected':''}>active</option><option ${g.status==='maintenance'?'selected':''}>maintenance</option><option ${g.status==='disabled'?'selected':''}>disabled</option></select></td><td><input id="n${g.id}" value="${g.min_bet}"></td><td><input id="x${g.id}" value="${g.max_bet}"></td><td><input id="t${g.id}" value="${g.round_seconds}"></td><td><button onclick="save(${g.id})">Lưu</button></td></tr>`).join('')}async function save(id){try{await API.gameAdmin({id,status:$('s'+id).value,min_bet:Number($('n'+id).value),max_bet:Number($('x'+id).value),round_seconds:Number($('t'+id).value)});alert('Đã lưu');audit()}catch(e){alert(e.message)}}async function audit(){const x=await API.audit();$('at').innerHTML=x.items.map(a=>`<tr><td>${a.created_at}</td><td>${a.actor||'-'}</td><td>${a.action}</td><td>${a.target_user_id||'-'}</td><td>${JSON.stringify(a.payload_json||{})}</td></tr>`).join('')}init();</script></body></html>
