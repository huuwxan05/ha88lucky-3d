services:
  - type: web
    name: royal-online
    runtime: docker
    plan: free
    healthCheckPath: /api/index.php?action=health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: royal-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: ROYAL ONLINE
      - key: SESSION_NAME
        value: royal_session

databases:
  - name: royal-db
    plan: free
    databaseName: royal_online
    user: royal_user
